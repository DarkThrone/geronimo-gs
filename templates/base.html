<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% block title %}<title>{{ config.title }}</title>{% endblock title %}
  <meta name="description" content="{{ config.description }}">
  <meta property="og:image" content="{{ config.extra.og_image }}">
  <meta name="theme-color" content="#000">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-config" content="/favicon/browserconfig.xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#000000">
  <link rel="shortcut icon" href="/favicon/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path='atom.xml') }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  {% include "partials/nav.html" %}

  <main class="main-content">
    {% block content %}{% endblock content %}
  </main>

  {% include "partials/footer.html" %}

  <script>
    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function() {
      const menuBtn = document.getElementById('menu-toggle');
      const mobileNav = document.getElementById('mobile-nav');
      if (menuBtn && mobileNav) {
        menuBtn.addEventListener('click', function() {
          mobileNav.classList.toggle('max-h-0');
          menuBtn.classList.toggle('bg-gray-200');
        });
      }

      // Navbar shadow on scroll
      const navbar = document.getElementById('navbar');
      const logo = document.getElementById('logo-icon');
      const logoTitle = document.getElementById('logo-title');
      window.addEventListener('scroll', function() {
        if (window.scrollY > 10) {
          navbar.classList.add('shadow-md');
          if (logo) { logo.style.width = '48px'; logo.style.height = '48px'; }
          if (logoTitle) logoTitle.classList.replace('text-3xl', 'text-xl');
        } else {
          navbar.classList.remove('shadow-md');
          if (logo) { logo.style.width = '64px'; logo.style.height = '64px'; }
          if (logoTitle) logoTitle.classList.replace('text-xl', 'text-3xl');
        }
      });
    });
  </script>
</body>
</html>
