name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.19.2/zola-v0.19.2-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv zola /usr/local/bin/

      - name: Build site with preview base URL
        run: |
          zola build --base-url "https://geronimo.gs/pr/${{ github.event.pull_request.number }}/"

      - name: Deploy to gh-pages subpath
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          DEPLOY_DIR="pr/${PR_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch gh-pages branch
          git fetch origin gh-pages:gh-pages || true

          # Create a temporary working directory
          WORK_DIR=$(mktemp -d)
          git worktree add "$WORK_DIR" gh-pages 2>/dev/null || {
            git worktree add --orphan "$WORK_DIR" gh-pages
          }

          # Clear previous preview for this PR and copy new build
          rm -rf "${WORK_DIR}/${DEPLOY_DIR}"
          mkdir -p "${WORK_DIR}/${DEPLOY_DIR}"
          cp -r public/* "${WORK_DIR}/${DEPLOY_DIR}/"

          # Preserve the CNAME and root site files
          cd "$WORK_DIR"
          git add "${DEPLOY_DIR}"
          git commit -m "Deploy preview for PR #${PR_NUMBER}" --allow-empty
          git push origin gh-pages

          # Clean up worktree
          cd -
          git worktree remove "$WORK_DIR" --force

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://geronimo.gs/pr/${prNumber}/`;
            const body = `🔍 **Preview deployed!**\n\n${previewUrl}\n\n_This preview will be cleaned up when the PR is closed._`;

            // Check for existing bot comment to update instead of spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed!')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if [ -d "pr/${PR_NUMBER}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            rm -rf "pr/${PR_NUMBER}"
            git add -A
            git commit -m "Clean up preview for PR #${PR_NUMBER}"
            git push origin gh-pages
          fi
